name: Run Unit Tests
on:
  pull_request:
    types:
      - synchronize
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 7
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '7'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew kotlinUpgradeYarnLock allTests
