name: Build Release
on:
  release:
    types: [ created ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 7
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '7'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish
        # -Pversion_release: releases must never resolve to a -SNAPSHOT
        # version; explicit flag keeps semantics correct even if the
        # resolved commons-gradle plugin is a stale pre-fix snapshot
        run: ./gradlew publish -Pversion_release -Pmvn.user=${{ secrets.MAVEN_USER }} -Pmvn.key=${{ secrets.MAVEN_TOKEN }} --info --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: ./build/libs/
